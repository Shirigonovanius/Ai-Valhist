<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Battle Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script> <style>
        .demon-frame {
            background: linear-gradient(180deg, #1f2024 0%, #0f0f11 100%);
            border: 1px solid #4a4a4d;
            box-shadow: 0 0 0 1px #000, 0 4px 15px rgba(0,0,0,0.9);
        }
        .magma-btn {
            background: linear-gradient(180deg, #e65100 0%, #bf360c 50%, #870000 100%);
            border: 1px solid #ffcc80; border-bottom: 2px solid #5d0000;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            box-shadow: inset 0 0 20px rgba(255, 100, 0, 0.5), 0 0 15px rgba(255, 69, 0, 0.6);
        }
        .magma-btn:hover { filter: brightness(1.2); box-shadow: 0 0 30px rgba(255, 80, 0, 1); }
        .magma-btn:disabled { filter: grayscale(1); cursor: not-allowed; }
        
        /* Анимация пульсации для поиска */
        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 20px rgba(255,0,0,0.2); }
            50% { box-shadow: 0 0 50px rgba(255,0,0,0.6); }
        }
        .searching-pulse { animation: pulse-red 2s infinite; }
    </style>
</head>

<body class="h-full bg-black text-gray-200 font-['Cinzel'] overflow-hidden relative selection:bg-red-900 selection:text-white">

    <div class="absolute inset-0 z-0">
        <img src="images/background.jpg" alt="Background" class="w-full h-full object-cover opacity-80"> 
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,transparent_0%,#000_100%)]"></div>
    </div>

    <div class="relative z-10 h-full flex flex-col px-8 py-6 max-w-[1800px] mx-auto">
        
        <div class="flex justify-between items-start w-full z-50">
            <div class="demon-frame flex items-center h-14 bg-[#0e0e10]/90 backdrop-blur-md rounded-sm">
                <div class="h-full w-16 flex items-center justify-center border-r border-gray-600 bg-gradient-to-b from-gray-700 to-black">
                    <span class="text-3xl text-white font-bold drop-shadow-md">A</span>
                </div>
                <nav class="flex items-center px-8 gap-8 text-sm font-bold tracking-[0.1em] text-gray-300 uppercase font-['Lato']">
                    <span class="opacity-50 cursor-not-allowed">Profile</span>
                    <div class="w-px h-5 bg-gray-500"></div> 
                    <a href="gallery.html" class="hover:text-white transition-colors">Gallery</a>
                </nav>
            </div>

            <button id="connect-btn" class="demon-frame h-14 px-10 text-sm font-bold tracking-[0.1em] text-gray-200 uppercase hover:text-white transition-all bg-[#0e0e10]/90 backdrop-blur-md rounded-sm font-['Lato'] flex items-center gap-3">
                <span id="connect-icon" class="text-lg">𝕏</span> 
                <span id="connect-text">Connect X</span>
            </button>
        </div>


        <main id="lobby-screen" class="flex-grow flex flex-col items-center justify-center text-center relative z-10 -mt-10 transition-opacity duration-500">
            <div class="relative z-10 mb-[-20px]"> 
                 <img src="images/demon.png" alt="Demon" class="w-[350px] md:w-[500px] lg:w-[650px] object-contain mx-auto drop-shadow-[0_20px_50px_rgba(0,0,0,0.8)] filter contrast-110">
            </div>
            
            <h1 class="text-7xl md:text-8xl lg:text-9xl font-bold text-white drop-shadow-[0_5px_5px_black] tracking-wide mb-4 uppercase leading-none relative z-20">
                Ai Entropy
            </h1>
            
            <p class="font-['Lato'] text-lg md:text-xl text-gray-400 max-w-2xl mx-auto leading-relaxed drop-shadow-md uppercase tracking-widest">
                The better prompt wins. The winner takes all.
            </p>
        </main>


        <main id="waiting-screen" class="hidden flex-grow flex-col items-center justify-center text-center relative z-10">
            <div class="w-64 h-64 rounded-full border-4 border-red-900/50 flex items-center justify-center searching-pulse bg-black/50 backdrop-blur-sm relative">
                <div class="absolute inset-0 rounded-full border-t-4 border-red-500 animate-spin"></div>
                
                <div class="flex flex-col gap-2">
                    <span class="text-4xl">⚔️</span>
                    <span class="font-['Cinzel'] text-xl text-red-500 font-bold">SEARCHING...</span>
                </div>
            </div>
            <h2 class="mt-8 text-3xl font-bold text-white uppercase tracking-widest">Waiting for Opponent</h2>
            <p class="mt-2 text-gray-400 font-['Lato']">Your stake is locked via Smart Contract</p>
        </main>


        <div id="action-panel" class="w-full flex justify-center pb-10 z-50">
            <div class="flex items-stretch h-20 md:h-24 p-1 gap-2 bg-[#0a0a0a] border-2 border-[#333] shadow-2xl">
                
                <div id="bet-box" class="w-24 md:w-32 flex items-center justify-center bg-[#151515] border border-[#333] cursor-pointer hover:bg-[#222] select-none group">
                    <span id="bet-value" class="text-3xl md:text-4xl font-bold text-gray-400 font-serif group-hover:text-white transition-colors">1</span>
                </div>

                <button id="battle-btn" class="magma-btn px-16 md:px-24 text-white font-bold text-2xl md:text-3xl tracking-[0.1em] uppercase hover:scale-[1.02] active:scale-[0.98] transition-all">
                    BATTLE NOW
                </button>
            </div>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="player.js"></script>
</body>
</html>
